<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Kong HTTP Log</title>
  <style>
    :root {
      --bg: #f6f7f9; --surface: #ffffff; --border: #e3e6ec; --border-strong: #d1d6de;
      --ink: #0b172d; --ink-2: #3c4557; --muted: #7a8496; --lime: #c5ff00;
      --err-bg: #fdeceb; --err-fg: #b3261e; --focus: #1155cb; --ink-btn: #101010;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.45;
      -webkit-font-smoothing: antialiased; min-height: 100vh;
      display: grid; place-items: center; padding: 1rem;
    }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
    .card {
      width: 100%; max-width: 380px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 12px; padding: 2rem 1.75rem;
      box-shadow: 0 1px 2px rgba(11,23,45,.04), 0 8px 24px rgba(11,23,45,.06);
    }
    .brand { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.5rem; }
    .brand-tile {
      width: 34px; height: 34px; flex: none; border-radius: 9px; background: #00110a;
      color: var(--lime); display: grid; place-items: center;
    }
    .brand-name { font-weight: 650; letter-spacing: -0.01em; }
    .brand-sub { font-size: 12px; color: var(--muted); }
    h1 { font-size: 20px; letter-spacing: -0.02em; margin-bottom: 0.25rem; }
    .lede { color: var(--muted); margin-bottom: 1.25rem; }
    label {
      display: block; font-size: 11px; font-weight: 650; letter-spacing: 0.07em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 0.35rem;
    }
    input[type=text], input[type=password] {
      width: 100%; font: inherit; color: var(--ink); background: var(--surface);
      border: 1px solid var(--border-strong); border-radius: 8px;
      padding: 0.6rem 0.75rem; margin-bottom: 1rem;
    }
    input:hover { border-color: var(--muted); }
    .error {
      background: var(--err-bg); color: var(--err-fg); border-radius: 8px;
      padding: 0.55rem 0.75rem; margin-bottom: 1rem; font-weight: 500;
    }
    button {
      width: 100%; font: inherit; cursor: pointer; background: var(--ink-btn);
      border: 1px solid var(--ink-btn); color: var(--lime); font-weight: 700;
      border-radius: 999px; padding: 0.65rem 1.25rem; margin-top: 0.25rem;
    }
    button:hover { background: #000; border-color: #000; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <div class="brand-tile" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" focusable="false">
        <path fill="currentColor" d="M7.59 18.9L8.82 20.74L8.72 20.95L8.74 21.62L13.59 21.62L14.03 20.77L12.05 18.26L8.03 18.26ZM8.56 10.77L5.49 13.33L4.23 13.33L1.23 17.15L1.15 21.62L4.46 21.62L7.62 17.41L11.56 17.28L12.59 15.51ZM10.9 6.87L9.13 9.87L9.33 10.41L17.95 20.54L17.77 21.62L21.69 21.62L22.54 18.18L13.08 6.87ZM14.49 2.36L12.1 4.33L11.28 5.9L13.49 6.03L16.1 9.28L17.18 10.33L19.26 8.56L19.26 7.41L18.54 6.51L18.54 6.28L19.05 5.77L14.82 2.36Z"/>
      </svg>
      </div>
      <div>
        <div class="brand-name">Kong HTTP Log</div>
        <div class="brand-sub">Gateway traffic viewer</div>
      </div>
    </div>
    <h1>Sign in</h1>
    <p class="lede">Enter your credentials to view logs.</p>
    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="{{ url_for('login') }}">
      <input type="hidden" name="next" value="{{ next }}">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required autofocus>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
